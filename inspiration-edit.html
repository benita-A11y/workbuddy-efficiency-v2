<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#B7A7D6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>编辑灵感</title>
  <link rel="stylesheet" href="css/inspiration.css">
</head>
<body>
  <div class="inse-app">
    <!-- 顶部：取消 / 标题 / 保存 -->
    <header class="inse-nav">
      <button class="inse-nav-btn" id="inseCancel" aria-label="取消">取消</button>
      <span class="inse-nav-title">编辑灵感</span>
      <button class="inse-save" id="inseSave" aria-label="保存">保存</button>
    </header>

    <main class="inse-scroll">
      <!-- 图片上传区（多图，可增删、拖拽排序） -->
      <div class="inse-uploader">
        <div class="inse-thumbs" id="inseThumbs"></div>
        <label class="inse-add">
          ＋ 图片
          <input type="file" accept="image/*" multiple id="inseImgInput" hidden>
        </label>
      </div>

      <input class="inse-input" id="inseTitle" placeholder="标题（选填）" maxlength="60">
      <textarea class="inse-textarea" id="inseBody" placeholder="记录搭配思路、妆容心得、色号、场景、季节、购买链接…" maxlength="2000"></textarea>

      <!-- 合集（动态渲染，可内联新建） -->
      <div class="insp-field">
        <span class="insp-label">合集（必选）</span>
        <div class="insp-cat-options" id="inseColOptions"></div>
        <button class="insp-text-btn" id="inseColAdd" type="button">＋ 新建合集</button>
      </div>

      <!-- 标签 -->
      <div class="insp-field">
        <span class="insp-label">标签（可多个，回车添加）</span>
        <div class="insp-tag-chips" id="inseTagChips"></div>
        <div class="insp-tag-add">
          <input id="inseTagInput" placeholder="如 通勤 / 约会 / 黄皮">
          <button class="insp-btn-primary insp-btn-sm" id="inseTagAdd" type="button">添加</button>
        </div>
        <div class="insp-tag-presets" id="inseTagPresets"></div>
      </div>
    </main>

    <!-- 新建合集弹窗 -->
    <div class="insp-modal" id="inseColModal" hidden>
      <div class="insp-modal-card insp-modal-card--sm">
        <div class="insp-modal-head">
          <button id="inseColClose" type="button" aria-label="关闭">✕</button>
          <span>新建合集</span>
          <span style="width:28px"></span>
        </div>
        <div class="insp-modal-body">
          <div class="insp-emoji-grid" id="inseColEmoji"></div>
          <input class="insp-input" id="inseColName" placeholder="合集名称" maxlength="12">
        </div>
        <div class="insp-modal-foot">
          <button class="insp-btn-primary" id="inseColSave" type="button">创建</button>
        </div>
      </div>
    </div>

    <div class="inse-toast" id="inseToast" hidden></div>
  </div>

  <script src="js/inspiration-db.js"></script>
  <script src="js/inspiration-edit.js"></script>
</body>
</html>
