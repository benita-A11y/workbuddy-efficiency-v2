  <!-- 主内容区 -->
  <main id="mainContent" class="main-content">
    <!-- 首页（卡片式聚合入口） -->
    <section class="module module-home active" id="homeModule">
      <!-- 顶部欢迎区域：奶杏柔和底色 + 轻量手绘贴纸装饰 -->
      <div class="welcome-area">
        <div class="welcome-deco" aria-hidden="true">
          <svg class="ws-blob ws1" viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="30" fill="#FBE3C4"/><path d="M20 24 l8 14 14-10" fill="none" stroke="#E9B98A" stroke-width="3" stroke-linecap="round"/></svg>
          <svg class="ws-blob ws2" viewBox="0 0 64 64" width="56" height="56"><path d="M32 10 l5 14 14 5 -14 5 -5 14 -5-14 -14-5 14-5z" fill="#F6D7E2"/><circle cx="32" cy="32" r="4" fill="#E79BB4"/></svg>
          <svg class="ws-blob ws3" viewBox="0 0 64 64" width="40" height="40"><path d="M14 40 q16 -28 36 -20 q-6 22 -36 20z" fill="#CFE6D6"/><path d="M44 22 q8 -6 14 2 q-8 6 -14 -2z" fill="#BFE0C8"/></svg>
        </div>
        <button class="welcome-settings" onclick="App.switchModule('profile')" aria-label="设置" title="设置">
          <span class="welcome-settings-emoji">⚙️</span>
        </button>
        <h1 class="welcome-title" id="homeGreeting"></h1>
        <p class="welcome-sub" id="homeDate"></p>
        <!-- 每日激励语（替换原 Benita 区域，与金句功能合并统一） -->
        <button class="home-quote" id="quoteBanner" aria-label="今日金句">
          <span class="qb-emoji">📖</span>
          <span class="qb-body">
            <span class="qb-text" id="quoteBannerText">正在为你挑选今日金句…</span>
            <span class="qb-trans" id="quoteBannerTrans" hidden></span>
          </span>
        </button>
      </div>

      <!-- 功能卡片网格：按使用频率重排（我的打卡 → 今日健康 → 阅读 → 消费 → 补品 → 宜忌 → 待办） -->
      <div class="home-grid-2x2">
        <!-- 卡片1：我的打卡（宽卡置顶，每天第一件仪式感） -->
        <button class="home-card home-card-wide" onclick="App.switchModule('checkin')" aria-label="我的打卡">
          <span class="hc-emoji">✅</span>
          <span class="hc-body">
            <span class="hc-title">我的打卡</span>
            <span class="hc-desc">每日习惯 · 温柔记录</span>
          </span>
        </button>

        <!-- 卡片2：今日健康（方案D：大号卡片 + 标题栏统计入口 + 三块明细） -->
        <button class="home-card home-card-health home-card-wide" onclick="App.switchModule('health')" aria-label="今日健康">
          <span class="hc-head">
            <span class="hc-emoji">🛌</span>
            <span class="hc-title">今日健康</span>
            <span class="hc-stat" role="button" tabindex="0" onclick="event.stopPropagation();App.switchModule('health')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();App.switchModule('health')}">📊 统计 →</span>
          </span>
          <span class="health-sub-areas">
            <span class="hs-area hs-sleep" role="button" tabindex="0" onclick="event.stopPropagation();App.openHealth('sleep')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();App.openHealth('sleep')}">
              <span class="hs-emoji">😴</span>
              <span class="hs-val" id="hsSleep">—</span>
              <span class="hs-detail" id="hsSleepDetail">—</span>
              <span class="hs-insight" id="hsSleepInsight">💡</span>
            </span>
            <span class="hs-area hs-period" role="button" tabindex="0" onclick="event.stopPropagation();App.openHealth('period')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();App.openHealth('period')}">
              <span class="hs-emoji">🩸</span>
              <span class="hs-val" id="hsPeriod">—</span>
              <span class="hs-detail" id="hsPeriodDetail">—</span>
              <span class="hs-insight" id="hsPeriodInsight">💡</span>
            </span>
            <span class="hs-area hs-bowel" role="button" tabindex="0" onclick="event.stopPropagation();App.openHealth('bowel')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();App.openHealth('bowel')}">

      var h = new Date().getHours();
      var greet = '晚上好';
      if (h < 5) greet = '夜深了';
      else if (h < 11) greet = '早上好';
      else if (h < 13) greet = '中午好';
      else if (h < 18) greet = '下午好';
      el.textContent = greet + '，今天也辛苦啦 🌿 慢慢来，一件件完成就好';
    })();

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
          // 检测到新版本自动接管，下次刷新即生效
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            if (nw) {
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  // 新版本已就绪，静默通知（不影响当前操作，刷新后生效）
                  console.log('[SW] 新版本已就绪，刷新后生效');
                }
              });
            }
          });
        }).catch(err => console.log('SW注册失败:', err));

        // 新 SW 接管后自动刷新一次，确保热更新生效
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            try { sessionStorage.setItem('sw_updated', '1'); } catch (e) {}
            window.location.reload();
          }
        });
      });
    }
  </script>

  <script>
    function openAlmanac() {
      if (window.Almanac) Almanac.open();
      else if (window.App) App.switchModule('almanac');
    }
    document.addEventListener('DOMContentLoaded', function () {
      // 首页卡片预览：今日宜忌简短摘要
      var pv = document.getElementById('almHomePreview');
      if (pv && window.Almanac) pv.textContent = Almanac.todayPreview();
      // 顶部日期按钮 → 原生日期选择器（快速跳转任意日期）
      var di = document.getElementById('almDateInput');
      if (di) di.addEventListener('change', function () {
        if (this.value && window.Almanac) Almanac.goDate(this.value);
      });
      // 移动端交互：右滑返回首页 + 顶部下拉刷新当日数据
      var body = document.getElementById('almBody');
      if (body) {
        var sx = 0, sy = 0, tracking = false;
        body.addEventListener('touchstart', function (e) {
          if (e.touches.length !== 1) return;
          sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
        }, { passive: true });
        body.addEventListener('touchend', function (e) {
          if (!tracking) return; tracking = false;
          var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
          if (Math.abs(dx) > Math.abs(dy) && dx > 70 && sx < 60) {
            if (window.App) App.switchModule('home');
          } else if (dy > 70 && Math.abs(dx) < 40 && body.scrollTop <= 0) {
            if (window.Almanac) Almanac.render();
            if (window.App && App.toast) App.toast('已刷新当日黄历 🔄');
          }
        }, { passive: true });
      }
    });
  </script>
